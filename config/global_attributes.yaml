title: "Sentinel-1 Norway Analysis-Ready Radar Backscatter and Coherence Data"  
summary: "For each available Sentinel-1 Single Look Complex product, radar backscatter data for available polarizations is radiometrically corrected for terrain effects and resampled at 10m posting. The output is divided into fixed 100km x 100km tiles in UTM zone 33. For each polarization, both the terrain corrected gamma nought backscatter and the corresponding uncorrected sigma nought backscatter are provided. In addition, the interferometric coherence between the product and the previous product from the same location and radar geometry is provided on the same grid."
title_no: "Analyseklare Sentinel-1-data for radar-tilbakespredning og koherens i Norge"
summary_no: "Alle tilgjengelige polarisasjoner i hvert tilgjengelige Sentinel-1-produkt på 'Single Look Complex'-format korrigeres for terreng-effekter, og interpoleres til et 10-meters rutenett. Resultatet deles i faste 100km x 100km ruter i UTM zone 33. For hver polarisasjon inneholder produktet både terreng-korrigert gamma-null og og ukorrigert sigma-null tilbakespreding. Produktet inneholder også interferometrisk koherens mellom produktet og det forrige tilgjengelige produktet fra samme lokasjon og radargeometri."
history: "netCDF created from GeoTIFFs using rasterio and xarray by the NBS project at Norwegian Meteorogolical Institute"
